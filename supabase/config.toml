project_id = "horaria"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/redefinir-senha"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false

[functions.whatsapp-notifications]
verify_jwt = false

# Public endpoints authenticate with Turnstile/tokens and server-side rate limits.
[functions.public-booking]
verify_jwt = false
[functions.public-tracking]
verify_jwt = false
# Server dispatch is authenticated by the private per-event dispatch token.
[functions.admin-billing-email]
verify_jwt = false
[functions.invite-team-member]
verify_jwt = true
