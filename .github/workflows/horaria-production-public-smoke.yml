name: Homologacao HTTP publica Horaria
on:
  push:
    branches:
      - release/horaria-4499-vercel-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar paginas publicas sem credenciais nem dados reais
        env:
          BASE_URL: https://hor-ria-tec.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.BASE_URL;
          const routes = ["/", "/entrar", "/cadastro", "/recuperar-senha", "/termos", "/privacidade"];
          let failed = false;
          for (const route of routes) {
            try {
              const res = await fetch(new URL(route, origin), {
                redirect: "follow",
                signal: AbortSignal.timeout(12000),
                headers: {"user-agent":"Horaria-ReadOnly-Production-Smoke/1.0","accept":"text/html"}
              });
              const html = await res.text();
              const vercelAuth = /Vercel Authentication|Authentication Required|_vercel\/sso|Vercel Security Checkpoint/i.test(html.slice(0,30000)) ||
                /vercel\.com\/(login|sso)/i.test(res.url);
              const ok = res.status === 200 && !vercelAuth;
              console.log(JSON.stringify({route,status:res.status,finalUrl:res.url,vercelAuth,ok}));
              if (!ok) failed = true;
            } catch (err) {
              console.log(JSON.stringify({route,ok:false,error:String(err).slice(0,250)}));
              failed = true;
            }
          }
          if (failed) process.exitCode = 1;
          NODE

  deny-anonymous-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir redirecionamento de rotas privadas e CSRF sem sessao
        env:
          BASE_URL: https://hor-ria-tec.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.BASE_URL;
          let failures = 0;
          for (const route of ["/painel", "/painel/ordens", "/admin", "/admin/configuracoes"]) {
            for (const cookie of ["", "horaria_access=invalid-session"]) {
              const r = await fetch(new URL(route, origin), {
                redirect: "manual",
                signal: AbortSignal.timeout(12000),
                headers: cookie ? {cookie} : {},
              });
              const next = r.headers.get("location") || "";
              const pass = [302,303,307,308].includes(r.status) && next.includes("/entrar");
              console.log(JSON.stringify({route,unauthorizedCookie:Boolean(cookie),status:r.status,redirect:next.slice(0,160),pass}));
              if (!pass) failures++;
            }
          }
          const cross = await fetch(new URL("/api/auth/session", origin), {
            method: "POST",
            headers: {"origin":"https://malicious.example.invalid","content-type":"application/json"},
            body: JSON.stringify({accessToken:"invalid-session"}),
            signal: AbortSignal.timeout(12000),
          });
          console.log(JSON.stringify({route:"/api/auth/session",test:"cross-origin",status:cross.status,pass:cross.status===403}));
          if (cross.status!==403) failures++;
          const noToken = await fetch(new URL("/api/auth/session", origin), {
            method: "POST",
            headers: {"origin":origin,"content-type":"application/json"},
            body: "{}",
            signal: AbortSignal.timeout(12000),
          });
          console.log(JSON.stringify({route:"/api/auth/session",test:"missing-token",status:noToken.status,pass:noToken.status===400}));
          if (noToken.status!==400) failures++;
          if (failures) {console.error("falhas=" + failures);process.exitCode=1;}
          NODE

  responsive-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout do CSS experimental
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Instalar motor de automacao de navegador isolado
        run: npm install --prefix /tmp/horaria-browser --no-audit --no-fund --silent playwright-core@1.56.0
      - name: Verificar rolagem e cortes em celular tablet e notebook
        env:
          BASE_URL: https://hor-ria-tec.vercel.app
        run: |
          node <<'NODE'
          const { chromium } = require("/tmp/horaria-browser/node_modules/playwright-core");
          const { execFileSync } = require("node:child_process");
          (async()=>{
            const binary = execFileSync("which",["google-chrome"],{encoding:"utf8"}).trim();
            const browser=await chromium.launch({headless:true,executablePath:binary,args:["--no-sandbox","--disable-dev-shm-usage"]});
            let failed=0;
            try{
              const page=await browser.newPage();
              for(const path of ["/","/entrar","/cadastro","/recuperar-senha"]){
                for(const [width,height] of [[320,568],[390,844],[768,1024],[1366,768]]){
                  await page.setViewportSize({width,height});
                  const response=await page.goto(new URL(path,process.env.BASE_URL).href,{waitUntil:"domcontentloaded",timeout:20000});
                  await page.waitForTimeout(650);
                  if (path === "/entrar" || path === "/cadastro") await page.addStyleTag({path:"tests/fixtures/auth-layout-probe.css"});
                  const m=await page.evaluate(()=>{
                    const w=window.innerWidth;
                    const all=[...document.querySelectorAll("body *")];
                    const offenders=all.filter(e=>{
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      if(s.display==="none"||s.visibility==="hidden"||!r.width||!r.height||e.closest('[aria-hidden="true"]'))return false;
                      return r.right > w+2 || r.left < -2;
                    }).slice(0,5).map(e=>({tag:e.tagName,cls:String(e.className).slice(0,55)}));
                    const authControls=[...document.querySelectorAll("form button, form input")].slice(-12).map(e=>{const r=e.getBoundingClientRect();return {kind:e.tagName,type:e.getAttribute("type"),name:e.getAttribute("name"),text:e.textContent.trim().slice(0,40),top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height)}});
                    const formNode=document.querySelector("form"); const formRect=formNode?.getBoundingClientRect();
                    const diag={bodyOverflowY:getComputedStyle(document.body).overflowY,htmlOverflowY:getComputedStyle(document.documentElement).overflowY,formRect:formRect?{top:Math.round(formRect.top),bottom:Math.round(formRect.bottom)}:null,authControls};
                    const formButtons=[...document.querySelectorAll("button[type=submit]")].map(e=>{
                      const r=e.getBoundingClientRect();
                      return {label:e.textContent.trim().slice(0,45),visibleInViewport:r.top>=0&&r.bottom<=innerHeight+2};
                    });
                    return {docWidth:document.documentElement.scrollWidth,docHeight:document.documentElement.scrollHeight,viewportHeight:innerHeight,offenders,formButtons,diag};
                  });
                  const ok=response?.status()===200 && m.docWidth<=width+2;
                  console.log(JSON.stringify({path,width,height,httpStatus:response?.status(),ok,...m}));
                  if(!ok)failed++;
                }
              }
            }finally{await browser.close()}
            if(failed){console.error("falhas_horizontais="+failed);process.exitCode=1}
          })().catch(e=>{console.error(String(e));process.exitCode=1});
          NODE
