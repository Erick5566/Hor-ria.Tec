name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Runtime smoke
        run: node tests/runtime-smoke.mjs


  sync-vercel-production:
    name: Sync Vercel production branch
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward Vercel production branch
        run: git push origin "$GITHUB_SHA:refs/heads/chatgpt/mvp-hardening-20261001"
